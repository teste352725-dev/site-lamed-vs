<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria | Painel Administrativo</title>
    <link rel="stylesheet" href="css/tailwind.generated.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <script src="js/admin-embedded-mode.js" defer></script>
    <script src="js/admin-native-shell.js?v=20260818-native-admin" defer></script>

        <link rel="stylesheet" href="css/galeria.css">
        <link rel="stylesheet" href="css/admin-native-shell.css?v=20260818-native-admin">
</head>
<body class="pb-20">
    <!--
      MAPA DE MANUTENCAO:
      - CSS desta pagina: css/galeria.css
      - JS local ligado a esta pagina: js/admin-embedded-mode.js, script inline desta pagina
      - Se mudar o design, preserve ids, classes utilitarias e data-* que o JS usa.
      - Antes de apagar um bloco, pesquise o id ou a classe no JS correspondente.
      - Ids usados pelo JS: #file-input, #gallery-grid, #upload-status
    -->


    <header class="bg-white shadow-sm sticky top-0 z-40 px-4 py-3">
        <div class="flex items-center gap-3">
            <a href="dashboard.html" class="text-gray-500"><i class="fa-solid fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold text-gray-800">Galeria</h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4">
        
        <!-- Upload Simples -->
        <div class="upload-box">
            <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-300 mb-2"></i>
            <p class="text-sm text-gray-500 mb-3">Selecione imagens para enviar</p>
            <input type="file" id="file-input" multiple accept="image/*" class="hidden">
            <button onclick="document.getElementById('file-input').click()" class="btn-primary w-full sm:w-auto">
                Escolher Arquivos
            </button>
            <div id="upload-status" class="mt-2 text-sm text-blue-600"></div>
        </div>

        <!-- Grid -->
        <div id="gallery-grid" class="grid grid-cols-3 sm:grid-cols-4 gap-2">
            <!-- Imagens aqui -->
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCzB4_YotWCPVh1yaqWkhbB4LypPQYvV4U",
            authDomain: "site-lamed.firebaseapp.com",
            databaseURL: "https://site-lamed-default-rtdb.firebaseio.com",
            projectId: "site-lamed",
            storageBucket: "site-lamed.firebasestorage.app",
            messagingSenderId: "862756160215",
            appId: "1:862756160215:web:d0fded233682bf93eaa692",
            measurementId: "G-BL1G961PGT"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        const auth = firebase.auth();
        const ADMIN_UIDS = ["NoGsCqiKc0VJwWb6rppk7QVLV1B2"];

        async function isAuthorizedAdmin(user) {
            if (!user) return false;
            if (ADMIN_UIDS.includes(user.uid)) return true;

            try {
                const tokenResult = await user.getIdTokenResult();
                return tokenResult?.claims?.admin === true;
            } catch (error) {
                return false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            auth.onAuthStateChanged(async (user) => {
                if (!(await isAuthorizedAdmin(user))) {
                    auth.signOut().catch(() => {});
                    window.location.href = 'login-admin.html';
                    return;
                }

                carregarGaleria();
            });

            document.getElementById('file-input').addEventListener('change', uploadImages);
        });

        function carregarGaleria() {
            db.collection('galeria').orderBy('dataUpload', 'desc').onSnapshot(snap => {
                const grid = document.getElementById('gallery-grid');
                grid.innerHTML = '';
                const fragment = document.createDocumentFragment();
                snap.forEach(doc => {
                    const img = doc.data();
                    if (!img.url) return;
                    const item = document.createElement('div');
                    item.className = 'gallery-item';
                    const image = document.createElement('img');
                    image.src = img.url;
                    image.alt = img.nome || 'Imagem da galeria';
                    image.loading = 'lazy';
                    image.decoding = 'async';
                    const button = document.createElement('button');
                    button.className = 'del-btn';
                    button.type = 'button';
                    button.setAttribute('aria-label', `Apagar ${img.nome || 'imagem'}`);
                    button.innerHTML = '<i class="fa-solid fa-times text-xs"></i>';
                    button.onclick = () => deletar(doc.id, img.path);
                    item.append(image, button);
                    fragment.appendChild(item);
                });
                grid.appendChild(fragment);
            }, error => {
                console.error(error);
                document.getElementById('upload-status').textContent = 'Não foi possível carregar a galeria.';
            });
        }

        async function uploadImages(e) {
            const files = Array.from(e.target.files || []);
            const status = document.getElementById('upload-status');
            if (!files.length) return;
            try {
                for (let index = 0; index < files.length; index += 1) {
                    const file = files[index];
                    status.textContent = `Otimizando e enviando ${index + 1} de ${files.length}: ${file.name}`;
                    const optimizedFile = await optimizeImageForUpload(file);
                    const safeName = optimizedFile.name.replace(/[^a-zA-Z0-9._-]+/g, '_');
                    const path = `galeria/${Date.now()}_${safeName}`;
                    const ref = storage.ref().child(path);
                    await ref.put(optimizedFile, { contentType: optimizedFile.type });
                    const url = await ref.getDownloadURL();
                    await db.collection('galeria').add({
                        url, path, nome: optimizedFile.name,
                        dataUpload: firebase.firestore.FieldValue.serverTimestamp(),
                        tamanhoOriginal: file.size, tamanhoOtimizado: optimizedFile.size
                    });
                }
                status.textContent = `${files.length} imagem(ns) enviada(s) com sucesso!`;
            } catch (error) {
                console.error(error);
                status.textContent = `Falha no envio: ${error.message}`;
            } finally {
                e.target.value = '';
                setTimeout(() => status.textContent = '', 4000);
            }
        }

        async function optimizeImageForUpload(file) {
            if (!String(file.type || '').startsWith('image/')) throw new Error('Selecione apenas imagens.');
            if (!/^image\/(jpeg|webp)$/i.test(file.type) || file.size < 650000) return file;
            if (!("createImageBitmap" in window)) return file;
            const bitmap = await createImageBitmap(file);
            const scale = Math.min(1, 1800 / Math.max(bitmap.width, bitmap.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(bitmap.width * scale));
            canvas.height = Math.max(1, Math.round(bitmap.height * scale));
            canvas.getContext('2d', { alpha: false }).drawImage(bitmap, 0, 0, canvas.width, canvas.height);
            bitmap.close();
            const blob = await new Promise((resolve, reject) => canvas.toBlob(
                result => result ? resolve(result) : reject(new Error('Não foi possível otimizar a imagem.')),
                'image/webp', 0.84
            ));
            return new File([blob], `${file.name.replace(/\.[^.]+$/, '') || 'imagem'}.webp`, { type: 'image/webp', lastModified: Date.now() });
        }

        window.deletar = async (id, path) => {
            if(!confirm('Apagar imagem?')) return;
            if(path) await storage.ref().child(path).delete().catch(console.error);
            await db.collection('galeria').doc(id).delete();
        }
    </script>
</body>
</html>
