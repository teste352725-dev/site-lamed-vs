<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin | Laméd vs</title>
    <link rel="stylesheet" href="css/tailwind.generated.css">
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fontes usadas no logotipo e na interface -->
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
        <link rel="stylesheet" href="css/login-admin.css?v=20260818-unified-access">
</head>

<body>
    <!--
      MAPA DE MANUTENCAO:
      - CSS desta pagina: css/login-admin.css
      - JS local ligado a esta pagina: nenhum script local relevante
      - Se mudar o design, preserve ids, classes utilitarias e data-* que o JS usa.
      - Antes de apagar um bloco, pesquise o id ou a classe no JS correspondente.
      - Sem ids mapeados automaticamente. Verifique classes e data-* antes de remover algo do layout.
    -->


    <!-- Cabeçalho fixo branco -->
    <header class="fixed top-0 left-0 right-0 z-10 bg-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16 relative">
                <!-- Logo Centralizado -->
                <div class="flex-1 flex justify-center items-center absolute inset-0">
                    <a href="index.html" class="font-allura text-4xl text-[--cor-texto]">
                        Laméd vs
                    </a>
                </div>
                
                <!-- Botão de fechar -->
                <div class="absolute right-4 top-1/2 -translate-y-1/2 z-20">
                    <a href="index.html" class="text-gray-600 hover:text-gray-900 text-2xl p-2" aria-label="Fechar">
                        <i class="fa-solid fa-times"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo principal -->
    <div class="min-h-screen flex items-center justify-center pt-16">
        <!-- Bloco de Login Menor -->
        <div class="bg-white shadow-2xl rounded-lg w-full max-w-xs overflow-hidden mx-4">
            
            <form id="login-form" class="p-6 space-y-4">
                
                <h2 class="text-xl font-semibold text-center text-gray-700">Acesso Restrito</h2>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">E-mail ou usuário</label>
                    <input type="text" id="email" name="email" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Seu e-mail ou usuário da produção"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-[--cor-ouro-acento] focus:border-[--cor-ouro-acento] sm:text-sm">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <input type="password" id="password" name="password" required
                               class="block w-full px-3 py-2 border border-gray-300 rounded-md placeholder-gray-400 focus:outline-none focus:ring-[--cor-ouro-acento] focus:border-[--cor-ouro-acento] sm:text-sm pr-10">
                        
                        <!-- Ícone para mostrar ou ocultar a senha -->
                        <button type="button" id="toggle-password" class="password-icon-container" aria-label="Mostrar ou ocultar senha">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Mensagem de Erro -->
                <div id="error-message" class="text-red-500 text-sm text-center h-5">
                    <!-- Erros de login aparecem aqui -->
                </div>

                <div>
                    <button type="submit"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[--cor-marrom-cta] hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[--cor-marrom-cta] transition-colors">
                        Entrar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase e lógica de autenticação -->
    <script type="module">
        // IMPORTANTE: Cole sua firebaseConfig aqui!
        const firebaseConfig = {
          apiKey: "AIzaSyCzB4_YotWCPVh1yaqWkhbB4LypPQYvV4U",
          authDomain: "site-lamed.firebaseapp.com",
          databaseURL: "https://site-lamed-default-rtdb.firebaseio.com",
          projectId: "site-lamed",
          storageBucket: "site-lamed.firebasestorage.app",
          messagingSenderId: "862756160215",
          appId: "1:862756160215:web:d0fded233682bf93eaa692",
          measurementId: "G-BL1G961PGT"
        };

        // Importações do Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserSessionPersistence, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // Inicialização
        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);
            const ADMIN_UIDS = ["NoGsCqiKc0VJwWb6rppk7QVLV1B2"];

            async function resolveAccess(user) {
                if (!user) return { ok: false, role: null, reason: 'NO_USER' };
                if (ADMIN_UIDS.includes(user.uid)) return { ok: true, role: 'admin', reason: 'ALLOWLIST_UID' };

                try {
                    const tokenResult = await user.getIdTokenResult(true);
                    if (tokenResult?.claims?.admin === true) {
                        return { ok: true, role: 'admin', reason: 'CUSTOM_CLAIM_ADMIN' };
                    }
                    if (tokenResult?.claims?.production === true) {
                        return { ok: true, role: 'production', reason: 'CUSTOM_CLAIM_PRODUCTION' };
                    }
                    return { ok: false, role: null, reason: 'MISSING_ACCESS_CLAIM' };
                } catch (error) {
                    console.error("Falha ao ler permissões:", error);
                    return { ok: false, role: null, reason: 'CLAIM_READ_ERROR' };
                }
            }

            function loginIdentifier(value) {
                const raw = String(value || '').trim();
                if (raw.includes('@')) return raw;
                const username = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, '.').replace(/[^a-z0-9._-]/g, '').replace(/^[._-]+|[._-]+$/g, '');
                return `${username}@producao.lamedvs.com.br`;
            }

            function redirectForAccess(access) {
                window.location.href = access.role === 'production' ? './estoque-mesaposta.html' : './dashboard.html';
            }

            // Lógica da página
            const loginForm = document.getElementById('login-form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const errorMessage = document.getElementById('error-message');
            const togglePassword = document.getElementById('toggle-password');
            const passwordIcon = togglePassword.querySelector('i');
            const submitButton = loginForm.querySelector('button[type="submit"]');

            // --- Mostrar ou ocultar senha ---
            togglePassword.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                passwordIcon.classList.toggle('fa-eye', !isPassword);
                passwordIcon.classList.toggle('fa-eye-slash', isPassword);
            });

            // --- Login ---
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMessage.textContent = '';
                submitButton.disabled = true;
                submitButton.textContent = 'Verificando...';

                try {
                    // Define a persistência da sessão
                    await setPersistence(auth, browserSessionPersistence);
                    
                    const userCredential = await signInWithEmailAndPassword(auth, loginIdentifier(emailInput.value), passwordInput.value);
                    const idToken = await userCredential.user.getIdToken();

                    // Persistencia minima de diagnostico (sem salvar token bruto)
                    sessionStorage.setItem("lamed_admin_last_login_uid", userCredential.user.uid);
                    sessionStorage.setItem("lamed_admin_last_login_at", new Date().toISOString());

                    try {
                        const backendProbe = await fetch("/api/status", {
                            method: "GET",
                            headers: {
                                Authorization: `Bearer ${idToken}`
                            }
                        });
                        console.log("Probe /api/status:", backendProbe.status);
                    } catch (probeError) {
                        console.error("Falha ao acessar backend /api/status (possivel CORS/rede):", probeError);
                    }

                    const access = await resolveAccess(userCredential.user);
                    if (!access.ok) {
                        await signOut(auth);
                        throw new Error(`AUTH_NO_ACCESS:${access.reason}`);
                    }
                    
                    console.log("Login com sucesso! Redirecionando...");
                    
                    // SUCESSO! REDIRECIONA PARA O PAINEL DE ADMIN
                    // Usa URL relativa válida para o redirecionamento
                    redirectForAccess(access);

                } catch (error) {
                    console.error("Erro no login:", error);
                    errorMessage.classList.add('text-red-500');
                    errorMessage.classList.remove('text-green-500');
                    
                    if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        errorMessage.textContent = 'E-mail, usuário ou senha inválidos.';
                    } else if (String(error.message || '').startsWith('AUTH_NO_ACCESS')) {
                        if (String(error.message).includes('CLAIM_READ_ERROR')) {
                            errorMessage.textContent = 'Nao foi possivel validar permissao admin agora. Verifique sua conexao e tente novamente.';
                        } else if (String(error.message).includes('MISSING_ACCESS_CLAIM')) {
                            errorMessage.textContent = 'Esta conta não possui acesso administrativo nem acesso à produção.';
                        } else {
                            errorMessage.textContent = 'Sua conta não tem acesso a esta área.';
                        }
                    } else if (error.code === 'auth/invalid-email') {
                         errorMessage.textContent = 'O formato do e-mail é inválido.';
                    // CORRIGIDO: Convertido error.code para String() para evitar o TypeError
                    } else if (String(error.code).includes('api-key')) {
                        errorMessage.textContent = 'Erro: Verifique sua firebaseConfig.';
                    }
                    else {
                        errorMessage.textContent = 'Ocorreu um erro. Tente novamente.';
                    }

                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Entrar';
                }
            });

            // --- Verificação de sessão ---
            // Redireciona quando o usuário já está autenticado
            onAuthStateChanged(auth, async (user) => {
                const access = await resolveAccess(user);
                if (access.ok) {
                    console.log("Usuario ja esta logado. Redirecionando...");
                    redirectForAccess(access);
                } else if (user) {
                    console.warn("Usuario autenticado sem acesso:", access.reason, user.uid);
                } else {
                    console.log("Nenhum usuário autenticado.");
                }
            });

        } catch (e) {
            console.error("Erro fatal ao inicializar o Firebase:", e.message);
            const errorDiv = document.getElementById('error-message');
            errorDiv.classList.add('text-red-500');
            if (e.message.includes("firebaseConfig")) {
                 errorDiv.textContent = "Erro: 'firebaseConfig' não foi definida.";
            } else if (e.message.includes("API key")) {
                 errorDiv.textContent = "Erro: API Key inválida na 'firebaseConfig'.";
            } else {
                errorDiv.textContent = "Erro crítico na inicialização. Verifique o console.";
            }
        }

    </script>

</body>

</html>
